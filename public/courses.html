<!doctype html>
<html lang="zh-Hant">
<head>
  <link rel="icon" href="/favicon.ico">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的課程｜課堂搶答</title><meta name="description" content="進入課程、加入小組，查看課堂搶答活動與作答紀錄。"><link rel="stylesheet" href="style.css">
  <script src="/share-code.js" defer></script>
  <script src="/confirm-delete.js" defer></script>
  <script src="/classroom-drafts.js" defer></script>
  <script src="/workspace.js" defer></script>
  <script type="module" src="/courses.js"></script>
</head>
<body>
  <header class="topbar"><a href="/" class="brand" aria-label="課堂搶答首頁"><span class="book-mark" aria-hidden="true"></span>課堂搶答</a></header>
  <main class="course-home">
    <div class="course-entry">
      <div class="course-heading"><h1 id="title">進入課堂</h1><p class="board-caption">小組搶答與課堂紀錄</p><span class="board-eraser" aria-hidden="true"></span></div>
      <div class="entry-controls">
        <div id="entry-state">
          <p id="entry-message" class="muted" role="status">正在準備登入…</p>
          <button id="entry-retry" type="button" class="secondary" hidden>重新載入</button>
          <button id="entry-signout" type="button" class="text-button" hidden>切換帳號</button>
        </div>
        <p id="notice" role="status" hidden></p>
        <nav id="login-roles" class="role-switch" aria-label="選擇身分" hidden><button id="student" aria-pressed="true">學生</button><button id="staff" aria-pressed="false">老師與助教</button></nav>
        <section id="login" hidden><h2 id="intro">登入你的小組</h2><p id="hint">使用自己的 Google 帳號登入，再加入或建立課程小組。</p><button id="google" class="primary" disabled>使用 Google 帳號登入</button></section>
        <noscript><p>請開啟 JavaScript 以登入課程。</p></noscript>
      </div>
    </div>
    <div id="workspace"></div>
  </main>
</body></html>
